<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=, initial-scale=1.0">
   <title>Form</title>
</head>

<body>
   <h1>forms</h1>
   <div>

      <form action="https://google.com" target="_blank">
      
         <fieldset>
            
        <legend>Enter Your Basic Informatiom</legend>

         <label for="Fullname"> Full name: </label>
         <input type="text" id="Fullname" placeholder="Enter your name" required >

         <br><br>
         <label for="email"> Email: </label>
         <input type="text" id="email" placeholder="Enter your email">

         <br><br>
         <label for="password"> Password: </label>
         <input type="password" id="password" placeholder="Enter your password"required >

         <br><br>
         <label for="checkbox : "> Are you 18+</label>
         <input type="checkbox" id="checkbox">

         <br><br>
         <label for="phoneNumber">Enter your phone phone Number: </label>
         <input type="number" id="phoneNumber" placeholder="phone number" required  min="0">

         <br><br>
         <label for="male">Gender: </label>
         <label for="male">male </label>
         <input type="radio" id="male" name="gender"required>
         <label for="female">female</label>
         <input type="radio" id="female" name="gender"required>

         <br><br>
         <label for="date"> Enter you DOB: </label>
         <input type="date" id="date" required>

         <br><br>
         <label for="file"> Upload photo: </label>
         <input type="file" id="file" required>
        
         <br><br>

         <label for="city"> Select your city  : </label>
         <select name="city" id="city">

            <option value="godda">Godda</option>
            <option value="gumla">Gumla</option>
            <option value="palamu">Palamu</option>
            <option value="sahibganj">Sahibganj</option>
            <option value=""saraikela>Saraikela Kharsawan</option>

         </select>
<br><br>
         <button type="submit">Sumbit form</button>

          </fieldset>

      </form>






   </div>
